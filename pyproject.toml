[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyco"
version = "0.1.0"
description = "Run a tiny company of AI agents: an org chart, tasks with real checks, and nothing billed while idle."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ThePeeps191" }]
requires-python = ">=3.11"
dependencies = ["anthropic>=2.5"]
keywords = ["ai", "agents", "multi-agent", "llm", "claude", "orchestration", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ThePeeps191/tinyco"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tinyco = "tinyco.cli:main"

[tool.setuptools.packages.find]
include = ["tinyco*"]

[tool.setuptools.package-data]
tinyco = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
